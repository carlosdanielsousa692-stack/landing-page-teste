<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D19A" />
      <stop offset="50%" stop-color="#C3A45D" />
      <stop offset="100%" stop-color="#9E813E" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B335A" />
      <stop offset="100%" stop-color="#0F1D33" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo Quadrado Arredondado Azul Marinho Nobre -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.6" />

  <!-- Monograma M Moderno e Símbolo de Balança da Justiça em Ouro -->
  <g filter="url(#subtleGlow)">
    <!-- Letra [M] Estilizada e Contemporânea -->
    <path d="M 120 376 L 120 144 L 176 144 L 256 288 L 336 144 L 392 144 L 392 376 L 340 376 L 340 228 L 276 344 L 236 344 L 172 228 L 172 376 Z" fill="url(#goldGrad)" />
    
    <!-- Eixo da Justiça Integrado ao Centro -->
    <circle cx="256" cy="116" r="14" fill="url(#goldGrad)" />
    <path d="M 248 136 L 264 136 L 264 186 L 248 186 Z" fill="url(#goldGrad)" />
    
    <!-- Linhas Sutis de Balança da Justiça -->
    <line x1="140" y1="396" x2="372" y2="396" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
